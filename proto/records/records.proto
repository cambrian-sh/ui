syntax = "proto3";

package cambrian.premium.records;

option go_package = "github.com/cambrian-sh/cambrian-premium/api/proto/records;recordspb";

import "google/protobuf/timestamp.proto";

// RecordLane is the PREMIUM record-ingest plane (ADR-0102), mounted on the kernel
// gRPC server via the OSS app.Options.ExtraServices seam (ADR-0073). It is
// authenticated by the same server-level operator auth interceptors as the OSS
// OperatorConsole plane — an extension of the operator transport plane, not a
// bypass.
//
// It lives here rather than in the pinned OSS operator.proto for the reason
// ADR-0102 records: operator.proto is a held-stable contract, and an unproven
// product feature should not be a permanent commitment on it. This proto is owned
// and versioned by cambrian-premium.
//
// The customer PUSHES; Cambrian never pulls from a named ERP. Mid-market ERP is
// fragmented — NetSuite, Dynamics BC, SAP B1, Odoo, sector MRPs — so a named
// connector is a bet that the next customer runs the same thing, and it costs a
// quarter to lose. The transports (webhook, CSV drop, read-only view) are
// DAEMONS outside the kernel that call this RPC; they are convenience, and the
// schema below is the contract.
service RecordLane {
  // IngestRecords accepts one pushed batch. Batch by default: a PO table push is
  // thousands of rows, and single-record ingest is the degenerate case rather
  // than a second RPC.
  rpc IngestRecords(IngestRecordsRequest) returns (IngestRecordsResponse);

  // ListRetentionRuns reports what the compactor dropped and when.
  //
  // On the PLUGIN's plane rather than the kernel's operator feed, and that is a
  // consequence of owning the plane rather than a shortcut: the kernel's feed
  // bridge subscribes to specific event types, so surfacing a plugin event there
  // would require a change to cambrian-core. Silent data loss in an audit product
  // is a contradiction, so this is the surface that makes deletion answerable.
  rpc ListRetentionRuns(ListRetentionRunsRequest) returns (ListRetentionRunsResponse);

  // ListRefusals reports derivations that were REFUSED because they would have
  // crossed a closed-tag boundary (ADR-0095 D9).
  //
  // This is what keeps "suppressed by policy" distinguishable from "nothing
  // found". A detection product whose silences look identical to its successes
  // is not one anybody should trust, and an operator who cannot see that a
  // policy boundary suppressed a detection cannot act on it.
  rpc ListRefusals(ListRefusalsRequest) returns (ListRefusalsResponse);

  // GetDriftStats reports the reconciliation tally (DRIFT-02).
  //
  // The UNRESOLVED counts are the reason this RPC exists. A drift detector that
  // reports only what it found lets "nothing drifted" and "nothing could be
  // compared" look identical from the console, and the second is the one that
  // costs money. Broken out by reason because the remedies differ: 400
  // record_not_found means the export is stale, 400 ambiguous_match means the
  // counterparty naming is — different teams, different week.
  rpc GetDriftStats(GetDriftStatsRequest) returns (GetDriftStatsResponse);

  // IngestMessages pushes conversation traffic through the drift pipeline
  // (DRIFT-03). Symmetric to IngestRecords, and for the same reason: the customer
  // PUSHES. A comms connector (BRAIN-03) is a daemon outside the kernel that
  // calls this; the message shape below is the contract, not any one chat vendor's.
  //
  // Synchronous, returning one result per message. A fire-and-forget ingest would
  // make "did that produce an alert" unanswerable without polling, and it is the
  // question every caller has.
  rpc IngestMessages(IngestMessagesRequest) returns (IngestMessagesResponse);

  // ListAlerts reads raised drift alerts, newest first, filtered by the caller's
  // scope. An alert quotes restricted material by construction, so an unscoped
  // alert log would be the most efficient way yet invented to launder it — read
  // the record you cannot see out of the alert about it.
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);

  // ReportCoverage is a CONNECTOR declaring what it can and cannot see.
  //
  // A push, for the same reason IngestRecords is: Cambrian never reaches into a
  // named workspace, and coverage is knowable only by the daemon holding the
  // token. The kernel cannot enumerate a customer's Slack channels; the bot in
  // that workspace can, and only for the channels it was invited to.
  //
  // Idempotent — the latest report per source wins. A connector re-reports on
  // every reconnect, which for Socket Mode is often, so this is self-healing
  // rather than a thing anyone has to remember to refresh.
  rpc ReportCoverage(ReportCoverageRequest) returns (ReportCoverageResponse);

  // GetCoverage returns every source's coverage, for the console.
  //
  // The most likely way this product loses trust is a customer finding a message
  // it never saw and concluding detection is unreliable — when the lane was
  // simply never connected to that channel. Coverage is the denominator, and it
  // has to be visible BEFORE anyone measures recall against it.
  rpc GetCoverage(GetCoverageRequest) returns (GetCoverageResponse);

  // GetPushStatus reports the last accepted push per record kind.
  //
  // Pure read over data the lane already keeps: drift_record_pushes exists as an
  // idempotency key and doubles as an import audit — how many rows, which
  // transport, when. "Your ERP export last landed 9 days ago" is the answer to
  // most questions that otherwise arrive as "why did it miss this".
  rpc GetPushStatus(GetPushStatusRequest) returns (GetPushStatusResponse);

  // RetractCommitment retires a speaker's live commitment about a record without
  // replacing it — the dateless "actually, scratch that".
  //
  // An explicit RPC because a bare retraction carries no date, so stage 1 never
  // admits it and no later commitment supersedes the old one. Recognising one in
  // prose is the LLM arm's job; pretending a regex can do it would hide a known
  // gap behind a passing test.
  rpc RetractCommitment(RetractCommitmentRequest) returns (RetractCommitmentResponse);
}

// Message is one piece of conversation traffic.
//
// Deliberately NOT a Slack shape. Mid-market comms is as fragmented as mid-market
// ERP, and a schema shaped around one vendor's event envelope is a bet that the
// next customer runs the same thing.
message Message {
  // id is the caller's message identity and the replay key. The same id must not
  // produce a second commitment — a chat connector redelivering on reconnect is
  // exactly the caller that will replay.
  string id = 1;
  string speaker = 2;
  string text = 3;
  google.protobuf.Timestamp timestamp = 4;
  // tags are the message's classification. They are INHERITED by any commitment
  // extracted from it and by any alert derived from that (ADR-0095 D9): a promise
  // distilled from restricted material is itself restricted. Nothing in the
  // pipeline invents a classification.
  repeated string tags = 5;
  // counterparty is who the conversation is with, when the surface knows. Most
  // messages never name the customer because the channel already implies them.
  string counterparty = 6;
}

message IngestMessagesRequest {
  string command_id = 1;
  string reason = 2;
  // Processed IN ORDER, and the order is the caller's. A retraction only works if
  // the retracting message is seen after the one it retracts, and re-sorting by a
  // timestamp the sender controls would let a doctored clock retract a commitment
  // it never saw.
  repeated Message messages = 3;
}

// MessageResult is what happened to one message. Every stage is reported
// separately: "stage 1 dropped it" and "stage 2 declined it" are different
// failures with different owners, and a single boolean would merge them.
message MessageResult {
  string message_id = 1;
  bool candidate = 2;
  bool committed = 3;
  bool replayed = 4;
  // outcome is "consistent" | "drift" | "unresolved" | "refused", empty when no
  // commitment was extracted.
  string outcome = 5;
  string unresolved_reason = 6;
  int32 delta_days = 7;
  bool alerted = 8;
  int64 alert_id = 9;
  // error is per-message. One unparseable line must not abort a batch.
  string error = 10;
}

message IngestMessagesResponse {
  string command_id = 1;
  repeated MessageResult results = 2;
}

message ListAlertsRequest {
  int32 limit = 1;
}

message AlertCitation {
  int32 index = 1;
  // kind is "message" or "record".
  string kind = 2;
  string ref = 3;
  string quote = 4;
  google.protobuf.Timestamp at = 5;
  // version_id is the record version quoted, zero for a message citation. It is
  // what the retention floor protects.
  int64 version_id = 6;
}

message Alert {
  int64 id = 1;
  string kind = 2;
  string record_key = 3;
  string owner = 4;
  string speaker = 5;
  string message_id = 6;
  int32 delta_days = 7;
  google.protobuf.Timestamp promised = 8;
  google.protobuf.Timestamp recorded = 9;
  // slip_count is how many DISTINCT dates the record has carried. Distinct rather
  // than versions: a nightly export rewrites every open record, so counting
  // versions would report "moved 90 times" for a date that never changed.
  int32 slip_count = 10;
  // text carries inline [n] markers matching the citations below (ADR-0081).
  string text = 11;
  repeated AlertCitation citations = 12;
  // tags is the INHERITED classification. An alert is never more visible than the
  // material it quotes.
  repeated string tags = 13;
  google.protobuf.Timestamp raised_at = 14;
  // detect_latency_ms is measured from the MESSAGE arriving, not from when
  // reconciliation started — a drift caught after the ship date is worth nothing,
  // and timing only the last hop would answer a question nobody asked.
  int64 detect_latency_ms = 15;
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

message RetractCommitmentRequest {
  string command_id = 1;
  string reason = 2;
  string speaker = 3;
  string record_ref = 4;
}

message RetractCommitmentResponse {
  string command_id = 1;
}

message GetDriftStatsRequest {}

message GetDriftStatsResponse {
  int32 consistent = 1;
  int32 drift = 2;
  // refused counts alerts NOT derived because they would have crossed a closed-tag
  // boundary (ADR-0095 D9). Their detail is on ListRefusals.
  int32 refused = 3;
  // unresolved is keyed by reason: "no_record_reference", "record_not_found",
  // "ambiguous_match", "record_missing_promised_date", "record_older_than_commitment".
  map<string, int32> unresolved = 4;
  // total is the DENOMINATOR, reported rather than left to the caller to sum:
  // "12 drifts found" means nothing without it, since 12 of 15 and 12 of 40,000
  // are opposite findings.
  int32 total = 5;
  // NOTE: this tally is PROCESS-LIFETIME, not durable — a restart resets it while
  // available stays true. The durable truth is ListAlerts and the record tables;
  // treat this as an operational gauge rather than a record.
  //
  // available is false when this deployment has no record lane. Distinguishes a
  // genuine all-zero tally from a plugin that never had a store — without it, an
  // absent lane reads as a clean bill of health.
  bool available = 6;
}

message ListRefusalsRequest {
  int32 limit = 1;
}

message Refusal {
  int64 id = 1;
  google.protobuf.Timestamp at = 2;
  // kind is what was being derived, e.g. "drift_alert".
  string kind = 3;
  // ref is the subject, e.g. the record key.
  string ref = 4;
  // boundary names the distinct closed tags that could not be combined. Naming
  // it is the difference between a refusal an administrator can act on and one
  // they can only notice.
  repeated string boundary = 5;
  string reason = 6;
}

message ListRefusalsResponse {
  repeated Refusal refusals = 1;
}

message ListRetentionRunsRequest {
  // limit defaults to 50 and is capped server-side.
  int32 limit = 1;
}

message RetentionRun {
  int64 id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  int32 versions_deleted = 4;
  int32 commands_deleted = 5;
  // bounded is true when the pass hit its per-pass cap and more remains. An
  // operator seeing this every hour is being told the backlog is not draining.
  bool bounded = 6;
  // error is empty on success. A FAILED pass is recorded too — a retention
  // product that fails silently is the contradiction this surface exists to
  // prevent.
  string error = 7;
}

message ListRetentionRunsResponse {
  repeated RetentionRun runs = 1;
}

// RecordValue is one typed attribute.
//
// Typed rather than a string map because the drift engine compares dates for a
// living, and an untyped map pushes parsing into every consumer until two of them
// disagree about what "14/03" means.
message RecordValue {
  // One of "string" | "number" | "date" | "bool". The matching field below is
  // read and the rest ignored. An unrecognised type is REJECTED rather than
  // stored as a zero value that would later read as real data.
  string type = 1;
  string string_value = 2;
  double number_value = 3;
  google.protobuf.Timestamp date_value = 4;
  bool bool_value = 5;
}

message Record {
  // kind names a record family ("purchase_order"). Kinds are configuration
  // rather than compiled types, so a new family is a config change, not a
  // release.
  string kind = 1;
  // key is customer-supplied and unique within kind. Together they are identity.
  string key = 2;
  // owner is the counterparty this record belongs to — "what did we promise this
  // customer" is the second question the drift engine asks.
  string owner = 3;
  map<string, RecordValue> attributes = 4;
  // Classification tags from the controlled vocabulary. A record carrying NONE is
  // refused rather than stored: an untagged row has no tags for any predicate to
  // act on, so the boundary is inexpressible regardless of what policy is written
  // (ADR-0102 D8). A tag outside the vocabulary is refused too — a typo'd label is
  // not restricted, it is merely mislabelled, and it looks identical from the
  // console (ADR-0099).
  repeated string tags = 5;
  // valid_from is the business's clock — when this became true out in the world.
  // observed_at is ours — when we were told. The gap between them is itself a
  // signal: a slip we learned about late is a different failure from one that
  // just happened. Unset observed_at defaults to receipt time; a zero would
  // poison any age or retention predicate that later reads it.
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp observed_at = 7;
}

message IngestRecordsRequest {
  // command_id dedups one RPC retry at the transport layer — the operator
  // plane's standing convention for a mutating call.
  string command_id = 1;
  // reason is mandatory on every mutating call, and is audited.
  string reason = 2;
  // push_id is the DURABLE batch identity and the store's idempotency key: a
  // customer's nightly exporter regenerates it across process restarts, and
  // replaying it writes nothing.
  //
  // Distinct from command_id on purpose. Two different callers, or the same
  // caller after a crash, can carry the same push under two command_ids — only
  // push_id catches that, and an unattended exporter is exactly the caller that
  // will do it.
  string push_id = 3;
  // Which door this batch came through: "webhook" | "csv" | "view". Closed set:
  // a typo'd transport would otherwise be recorded as provenance nobody can
  // trace back to a real importer.
  string transport = 4;
  repeated Record records = 5;
}

message IngestRecordsResponse {
  string command_id = 1;
  // deduped is true when this push had already been applied. A retry must be
  // indistinguishable from success to the caller — but it is REPORTED, because
  // an exporter deciding whether to advance its cursor needs "already had it"
  // told apart from "written", and both are successes.
  bool deduped = 2;
  // accepted counts records written. Zero with deduped=true is the replay case.
  int32 accepted = 3;
}


// ── coverage (BRAIN-03 / UI surface 3) ──────────────────────────────────────

message ReportCoverageRequest {
  SourceCoverage coverage = 1;
}
message ReportCoverageResponse {
  // accepted is false when the report was rejected — an empty source, say.
  // Reported rather than thrown: a connector must not crash-loop on a bad report,
  // and a coverage gap is not worth taking an ingress down for.
  bool accepted = 1;
}

message GetCoverageRequest {}
message GetCoverageResponse {
  repeated SourceCoverage sources = 1;
}

// SourceCoverage is what one connector can and cannot see.
message SourceCoverage {
  // source is the ingress surface this describes, e.g. "slack".
  string source = 1;
  // connector names the daemon that reported it.
  string connector = 2;
  repeated string invited_channels = 3;
  int32 channel_count = 4;
  // plan_tier drives the retention horizon: free | pro | business | enterprise_grid.
  string plan_tier = 5;

  // retention_horizon_days is how far back the SOURCE retains history at all.
  // -1 means "not reported", which is deliberately distinct from 0 ("nothing is
  // retained"). Ignore it entirely when horizon_unlimited is true: one integer
  // cannot carry "unlimited" and "unknown" without a console printing one as the
  // other, and a wrong horizon is a recall claim measured against the wrong
  // denominator.
  int32 retention_horizon_days = 6;
  bool horizon_unlimited = 7;

  // discovery_api is true only for an approved Enterprise Grid partner. False
  // means private channels, DMs and Slack Connect are NOT covered.
  bool discovery_api = 8;

  // limits is the plain-English list the connector already computes, carried
  // verbatim so the console renders the connector's own words rather than
  // re-deriving them from the booleans above and drifting out of step with it.
  repeated string limits = 9;

  // reported_at is when the connector last reported. NOT optional: coverage is
  // computed at daemon start, so a console rendering it without an age is making
  // an unverifiable claim — which is the exact failure this surface exists to stop.
  google.protobuf.Timestamp reported_at = 10;
}

message GetPushStatusRequest {}
message GetPushStatusResponse {
  repeated KindPushStatus kinds = 1;
}

// KindPushStatus is the last accepted push for one record kind.
message KindPushStatus {
  string kind = 1;
  string last_push_id = 2;
  string transport = 3;
  int32 record_count = 4;
  google.protobuf.Timestamp received_at = 5;
  // live_records is how many rows of this kind are currently un-superseded — the
  // number a customer recognises as "our open orders".
  int32 live_records = 6;
}
