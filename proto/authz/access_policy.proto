syntax = "proto3";

package cambrian.premium.authz;

option go_package = "github.com/cambrian-sh/cambrian-premium/api/proto/authz;authzpb";

// AccessPolicyAdmin is the PREMIUM-only policy administration plane (PAP),
// mounted on the kernel gRPC server via the OSS app.Options.ExtraServices seam
// (ADR-0073). It is authenticated by the same server-level operator auth
// interceptors as the OSS OperatorConsole plane — an extension of the operator
// transport plane, not a bypass.
//
// It lives here rather than in the pinned OSS operator.proto because groups,
// policy objects, and links are the premium product. The OSS contract carries
// only what the KERNEL needs to be explainable: ExplainAccess and the vocabulary
// listing (ADR-0085 §4.1). Authoring lives with the thing that decides.
//
// This proto is owned and versioned by cambrian-premium.
service AccessPolicyAdmin {
  // ── Groups: the containers policy is linked to ────────────────────────────
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // SaveGroup creates or replaces a group. Nesting cycles are rejected HERE, at
  // write time, so an administrator hears about the mistake while they still
  // remember making it.
  rpc SaveGroup(SaveGroupRequest) returns (SaveGroupResponse);
  rpc DeleteGroup(DeleteGroupRequest) returns (AckResponse);

  // ── Policy objects: named, versioned bundles of rules ─────────────────────
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  // SavePolicy validates before persisting: a rule that can never match anything
  // is refused, and so is a tag outside the controlled vocabulary. An
  // administrator who creates a policy that can never match must be told at save
  // time, not discover it through an empty result three days later (D14).
  rpc SavePolicy(SavePolicyRequest) returns (SavePolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (AckResponse);

  // ── Links: policy attaches to containers, never to individuals ────────────
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);
  rpc LinkPolicy(LinkPolicyRequest) returns (AckResponse);
  rpc UnlinkPolicy(UnlinkPolicyRequest) returns (AckResponse);

  // ── Rollout ───────────────────────────────────────────────────────────────
  // ResultantPolicy is `gpresult` for a principal: the effective terms, and which
  // policy — linked where — contributed each one. This is what makes the model
  // administrable rather than merely correct.
  rpc ResultantPolicy(ResultantPolicyRequest) returns (ResultantPolicyResponse);

  // SimulatePolicy answers "what would change if I enabled this?" by replaying
  // recent REAL decisions from the journal through a candidate policy set,
  // without acting (ADR-0085 D10). Same shape as the reactive engine's backtest,
  // different subject.
  rpc SimulatePolicy(SimulatePolicyRequest) returns (SimulatePolicyResponse);

  // ExportDecisions returns the decision journal for audit (D13). Denials are
  // never sampled.
  rpc ExportDecisions(ExportDecisionsRequest) returns (ExportDecisionsResponse);

  // ── Vocabulary: the tags, and which of them are CLOSED (ADR-0091) ─────────
  // Closed-ness is the most consequential property a tag has — it flips the tag to
  // deny-by-default — so an authoring UI that cannot show it will produce policies
  // whose effect the author cannot predict.
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);

  // ── Ingress registry: which daemons are entry points (ADR-0090 D2) ─────────
  // Registration MINTS A SURFACE — it decides what an entry point is permitted to
  // reach — so it lives on this plane, behind the same operator auth, and is
  // protected as carefully as policy itself.
  rpc ListIngresses(ListIngressesRequest) returns (ListIngressesResponse);
  // RegisterIngress declares that a daemon is an entry point and what surface the
  // kernel stamps on sessions it opens. A registration with no surface would be
  // inert, and an empty namespace prefix would read as a wildcard, so both are
  // refused HERE rather than stored and discovered later.
  rpc RegisterIngress(RegisterIngressRequest) returns (AckResponse);
  // DeregisterIngress makes a daemon an ordinary agent again. Its existing
  // conversations stop delivering immediately, because delivery re-checks the
  // registration rather than trusting the address it bound earlier.
  rpc DeregisterIngress(DeregisterIngressRequest) returns (AckResponse);

  // ── Party identities: WHO A READER IS (contract 0094, ADR-0121 D3) ────────
  // Row-level entitlement asks whether the reader is a party to a record, and
  // this table is the answer. It decides who reads what, so it sits on this
  // plane behind the same operator auth and is protected as policy is.
  //
  // It must NEVER be fed from the knowledge substrate it authorizes: a record
  // asserting `assignee: mallory` would otherwise make Mallory a party to it,
  // and any source that can write a record could widen its own audience.
  rpc ListPartyIdentities(ListPartyIdentitiesRequest) returns (ListPartyIdentitiesResponse);
  // AssignPartyIdentities REPLACES the identities a principal holds. Replace
  // rather than append, because an append-only surface makes removing a
  // relationship the one operation nobody can express — and that is the
  // operation that matters when somebody changes role.
  rpc AssignPartyIdentities(AssignPartyIdentitiesRequest) returns (AckResponse);
  // RevokePartyIdentities removes every identity a principal holds. Afterwards
  // they are a party to nothing, so every party-scoped record refuses them.
  rpc RevokePartyIdentities(RevokePartyIdentitiesRequest) returns (AckResponse);

  // ── Authoring assistant: English in, a VALIDATED PROPOSAL out ─────────────
  // ProposePolicy asks a model to draft a policy from a description and returns it
  // validated and simulated. It PROPOSES and never enforces: nothing is persisted,
  // and applying a proposal means the operator calling the ordinary SavePolicy and
  // LinkPolicy above, so every existing validation and audit record still applies.
  //
  // The response carries problems and a blast radius precisely so approval is a
  // judgement rather than a formality. The model cannot coin a tag, cannot grant an
  // open tag, and cannot choose to be enforced — a proposal always lands
  // report-only, and enforcing it is a separate deliberate act.
  rpc ProposePolicy(ProposePolicyRequest) returns (ProposePolicyResponse);

  // ListPrincipals enumerates every identity the policy model can act on.
  //
  // There is no principal TABLE — principals are referenced by group members and
  // policy links and nothing enumerates them — which is why a console's
  // principals surface listed zero on every deployment forever. This derives the
  // set from everywhere a principal can appear and reports WHERE each was seen.
  //
  // The field that earns it is `orphaned`: a policy linked to a principal that
  // does not exist applies to nobody, and from the policy list it is
  // indistinguishable from a working boundary.
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse);

  // ── Identity bindings (contract 0077) ─────────────────────────────────────
  //
  // Without these THE SURFACE IS THE IDENTITY: a policy links to
  // "chat:telegram", so every sender who finds the bot has identical reach.
  // "@unknown_4471" is governed by the same rule as "@afsin" — not because they
  // are different people, but because nobody is.
  //
  // They live on THIS plane rather than the surface's own admin service because
  // a binding maps an external id onto a PRINCIPAL: that is this plane's
  // vocabulary, the reach figure needs this plane's resolver, and the mapping is
  // surface-generic rather than specific to any one bridge.
  rpc ListIdentityBindings(ListIdentityBindingsRequest) returns (ListIdentityBindingsResponse);
  rpc BindIdentity(BindIdentityRequest) returns (AckResponse);
  rpc UnbindIdentity(UnbindIdentityRequest) returns (AckResponse);
  // ListUnboundSenders is the actual worklist: who has spoken through an entry
  // point without a binding. Everything else here acts on its rows.
  rpc ListUnboundSenders(ListUnboundSendersRequest) returns (ListUnboundSendersResponse);
  // BlockSender drops a sender AT THE INGRESS, before any policy or plan sees
  // them. Stronger than "every policy denies them", and it does not depend on
  // the policy set being right.
  rpc BlockSender(BlockSenderRequest) returns (AckResponse);
  rpc GetStrangerPolicy(GetStrangerPolicyRequest) returns (StrangerPolicySpec);
  rpc SetStrangerPolicy(SetStrangerPolicyRequest) returns (AckResponse);

  // ListIngressActivity reports who came through an entry point and what
  // happened, turning an ingress toggle from blind into informed.
  //
  // It is a filtered projection of the SAME decision journal ExportDecisions
  // reads, narrowed to surfaces owned by registered ingresses — not a second
  // record of the same events, which would be one more thing to keep in step.
  rpc ListIngressActivity(ListIngressActivityRequest) returns (ListIngressActivityResponse);
}

message AckResponse {
  bool ok = 1;
}

// ── shared shapes ───────────────────────────────────────────────────────────

// ScopeRule is the three-set tag term a policy contributes.
message ScopeRule {
  repeated string required_tags = 1;  // AND — must carry every one
  repeated string any_of_tags = 2;    // OR  — must carry at least one
  repeated string forbidden_tags = 3; // NONE — excluded if it carries any
  // granted_tags reopen CLOSED tags (ADR-0091). The only term that ADDS access
  // rather than removing it, and deliberately crippled: it may name nothing but a
  // tag someone declared closed, and it can never override forbidden_tags. A grant
  // on an open tag is refused at write time, since it would confer nothing.
  repeated string granted_tags = 4;
  // party_scoped_tags QUALIFY a tag this policy already grants: the reader sees a
  // record carrying one only if they are a party to that record (ADR-0121,
  // contract 0095). "Orders, but only your own."
  //
  // A RESTRICTION, never a grant — it can only remove rows, so it composes by
  // union like forbidden_tags and survives Block Inheritance. Unlike granted_tags
  // it may name ANY tag, open or closed: crippling grants bounds the blast radius
  // of ADDING access, and this only takes away.
  //
  // Naming a tag no policy grants is NOT refused: the restriction is routinely
  // authored in one policy and the grant in another, and what other policies grant
  // is not knowable when this one is saved.
  //
  // It IS checked against the controlled vocabulary, harder than any other term,
  // because a typo here fails OPEN — "if the record carries this tag you must be a
  // party to it" is vacuously satisfied by a tag no record carries, so a
  // misspelling deletes the restriction rather than narrowing it.
  repeated string party_scoped_tags = 5;
}

// EffectRule is the verb half: grant broadly, subtract narrowly. Deny always
// wins, consistent with forbidden tags being absolute.
message EffectRule {
  repeated string allow = 1; // empty = every effect (subject to deny)
  repeated string deny = 2;  // always wins
}

message GroupSpec {
  string id = 1;
  string name = 2;
  repeated string members = 3;   // principal ids
  repeated string subgroups = 4; // nested group ids; membership is transitive
  // block_inheritance stops policy accumulating from containers ABOVE this one —
  // except forbidden tags, and except links marked enforced.
  bool block_inheritance = 5;
}

message PolicySpec {
  string id = 1;
  string name = 2;
  int32 version = 3; // server-assigned; ignored on write
  ScopeRule rule = 4;
  EffectRule effects = 5;
  // mode is "enforced" or "report_only". Report-only evaluates and journals
  // without enforcing — the safe rollout path.
  string mode = 6;
  // expires_at_unix_ms bounds the policy in time (0 = no expiry). Carried from
  // v1 even though v1 always writes 0: retrofitting time-bounding into a grant
  // model that assumes permanence is expensive.
  int64 expires_at_unix_ms = 7;
  string granted_by = 8;
  int64 updated_at_unix_ms = 9;
}

message LinkSpec {
  string policy_id = 1;
  // container_kind is "organisation" | "group" | "principal" | "surface", in
  // application order — broadest first. This IS the precedence order.
  string container_kind = 2;
  string target_id = 3;
  // enforced means a downstream block_inheritance does not apply to this link.
  bool enforced = 4;
  int32 order = 5;
  int64 expires_at_unix_ms = 6;
  string granted_by = 7;
}

// ── requests / responses ────────────────────────────────────────────────────

message ListGroupsRequest {}
message ListGroupsResponse { repeated GroupSpec groups = 1; }

message SaveGroupRequest { GroupSpec group = 1; }
message SaveGroupResponse {
  bool ok = 1;
  // error names the problem in the administrator's terms (e.g. the cycle path).
  string error = 2;
}

message DeleteGroupRequest { string id = 1; }

message ListPoliciesRequest {}
message ListPoliciesResponse { repeated PolicySpec policies = 1; }

message SavePolicyRequest { PolicySpec policy = 1; }
message SavePolicyResponse {
  bool ok = 1;
  string error = 2;
  int32 version = 3;
}

message DeletePolicyRequest { string id = 1; }

message ListLinksRequest {}
message ListLinksResponse { repeated LinkSpec links = 1; }

message LinkPolicyRequest { LinkSpec link = 1; }
message UnlinkPolicyRequest {
  string policy_id = 1;
  string container_kind = 2;
  string target_id = 3;
}

message ResultantPolicyRequest {
  string principal_id = 1;
  string principal_kind = 2; // default "agent"
  string surface_kind = 3;
  string surface_id = 4;
}

// PolicyTermOp is one contributed term, attributed to its source.
message PolicyTermOp {
  string policy_id = 1;
  string policy_name = 2;
  string linked_at = 3; // "organisation" | "group:<id>" | "principal:<id>" | "surface:<id>"
  string term = 4;      // "required" | "any_of" | "forbidden" | "effect"
  repeated string values = 5;
  bool enforced = 6;
}

message ResultantPolicyResponse {
  // effective is the composed predicate the kernel would apply.
  ScopeRule effective = 1;
  // any_of_clauses is the CNF form: each clause is an OR-set, all clauses ANDed.
  repeated ScopeRule any_of_clauses = 2;
  // contributions explains which policy, linked where, produced each term.
  repeated PolicyTermOp contributions = 3;
  // effects is the composed effect grant.
  EffectRule effects = 4;
  string policy_version = 5;
  // unsatisfiable_reason is set when the effective predicate can never match
  // anything. It is a SAFE state (zero rows) and therefore the easiest one to
  // mistake for "there is no data", so it is stated rather than implied.
  string unsatisfiable_reason = 6;
  // groups lists the containers the principal resolved into, outermost first.
  repeated string groups = 7;
  // row_scope_note is set when the effective predicate carries party-scoped tags
  // (ADR-0121 D1c, contract 0095). Everything else in this response is a statement
  // about TAGS, which is a complete answer — this one term is not: access to a
  // party-scoped tag is decided per record, against identities resolved at query
  // time, so which rows the principal actually reads cannot be enumerated without
  // running the query.
  //
  // It is stated rather than implied because the failure is silent and one-sided:
  // a party-scoped grant rendered as a plain grant reads as "this customer can see
  // every order", and an administrator checking their work would be told the
  // opposite of the truth.
  string row_scope_note = 8;
  // party_identities is what the resolver returns for this principal RIGHT NOW —
  // the other half of the answer, and empty is the diagnosis worth having: a
  // principal who is a party to nothing reads NO party-scoped record, which looks
  // identical to an empty database.
  repeated string party_identities = 9;
}

message SimulatePolicyRequest {
  // draft policies replace same-id policies for the duration of the simulation.
  // Nothing is persisted.
  repeated PolicySpec draft_policies = 1;
  repeated LinkSpec draft_links = 2;
  // limit bounds how many journalled decisions are replayed (0 = a server default).
  int32 limit = 3;
}

// SimulatedDecision is one journalled decision replayed through the draft.
message SimulatedDecision {
  string principal = 1;
  string surface = 2;
  string resource = 3;
  repeated string tags = 4;
  bool allowed_now = 5;
  bool allowed_under_draft = 6;
  string reason_under_draft = 7;
  string detail_under_draft = 8;
  int64 at_unix_ms = 9;
}

message SimulatePolicyResponse {
  repeated SimulatedDecision decisions = 1;
  int32 newly_denied = 2; // allowed today, denied under the draft — the blast radius
  int32 newly_allowed = 3;
  int32 unchanged = 4;
  // row_scope_note is set when a draft policy carries party_scoped_tags
  // (ADR-0121 D1c, contract 0095), and it qualifies the counts above.
  //
  // The simulation replays the decision journal, which records each resource's
  // TAGS but not which parties it named — parties are a property of the record,
  // resolved in the query plane, and were never journalled. Re-asking a
  // party-scoped question therefore has no party to check against, and the
  // party-blind path fails closed, so every replayed record carrying such a tag
  // counts as newly denied.
  //
  // That makes newly_denied an UPPER BOUND rather than a prediction. Failing
  // closed is the right default, but silently overstating a blast radius is how a
  // correct policy gets abandoned — so the number is qualified rather than
  // presented as fact.
  string row_scope_note = 5;
}

message ExportDecisionsRequest {
  int32 limit = 1;
  // denials_only narrows the export to the rows anyone actually asks about.
  bool denials_only = 2;
}

message DecisionRecord {
  int64 at_unix_ms = 1;
  string principal = 2;
  string surface = 3;
  string resource = 4;
  bool allowed = 5;
  string reason = 6;
  string detail = 7;
  string policy_version = 8;
  bool report_only = 9;
  bool would_have_denied = 10;
  repeated PolicyTermOp decided_by = 11;
}

message ExportDecisionsResponse { repeated DecisionRecord records = 1; }

// ── Ingress registry (ADR-0090 D2) ──────────────────────────────────────────

// IngressSpec is one registered entry point.
message IngressSpec {
  // agent_id is the ingress daemon's agent id — the principal the kernel sees on
  // the connection, and the reason a daemon cannot choose its own registration.
  string agent_id = 1;
  // surface_kind / surface_id form the surface stamped on sessions this ingress
  // opens: the clamp that holds even when identity resolution is wrong.
  string surface_kind = 2;
  string surface_id = 3;
  // namespace bounds which external identities this ingress may speak for, as
  // prefixes. Empty means unrestricted — honest for a single-ingress deployment,
  // and load-bearing the moment a second one exists.
  repeated string namespace = 4;
}

message ListIngressesRequest {}
message ListIngressesResponse { repeated IngressSpec ingresses = 1; }

message RegisterIngressRequest { IngressSpec ingress = 1; }
message DeregisterIngressRequest { string agent_id = 1; }

message ListPartyIdentitiesRequest {
  // principal_id filters to one principal; empty lists every assignment.
  string principal_id = 1;
}

message PartyIdentityBinding {
  string principal_id = 1;
  repeated string identities = 2;
}

message ListPartyIdentitiesResponse {
  repeated PartyIdentityBinding bindings = 1;
}

message AssignPartyIdentitiesRequest {
  string principal_id = 1;
  // identities REPLACES what this principal held. Sending an empty list is the
  // same as revoking: it says "this principal is a party to nothing", which is
  // a statement rather than an omission.
  repeated string identities = 2;
  // reason is recorded. Changing who may read what is the kind of act somebody
  // asks about later.
  string reason = 3;
}

message RevokePartyIdentitiesRequest {
  string principal_id = 1;
  string reason = 2;
}

// ── Vocabulary (ADR-0091) ───────────────────────────────────────────────────

// TagSpec is one classification tag and whether it is deny-by-default.
message TagSpec {
  string tag = 1;
  // closed means nobody reaches this tag unless a policy grants it. A UI must show
  // this: selecting a closed tag in a Forbidden field is redundant, and selecting
  // one in a Required field without a matching grant produces a boundary that
  // matches nothing.
  bool closed = 2;
}

message ListTagsRequest {}
message ListTagsResponse { repeated TagSpec tags = 1; }

// ── Authoring assistant ─────────────────────────────────────────────────────

message ProposePolicyRequest {
  // request is what the operator wants, in their own words. It is handed to the
  // model as DATA inside a nonce fence (ADR-0063) and never as instructions.
  string request = 1;
  // simulate_limit bounds the journal replay (0 = a server default).
  int32 simulate_limit = 2;
}

// ProposalProblem is one reason a proposal is not safe to apply as it stands.
message ProposalProblem {
  // severity is "blocking" or "warning". Data rather than prose, so the console
  // can sort and colour without parsing sentences.
  string severity = 1;
  string message = 2;
}

message ProposePolicyResponse {
  // rationale is the model's explanation, shown as CONTEXT. It is not the thing
  // being approved — the policy and the simulation are.
  string rationale = 1;
  PolicySpec policy = 2;
  repeated LinkSpec links = 3;
  repeated ProposalProblem problems = 4;
  // simulation reuses the SimulatePolicy shape so a console renders the blast
  // radius with the code it already has. It is computed with the draft ENFORCED,
  // because the proposal lands report-only and simulating report-only would
  // report "no effect" for every proposal ever made.
  SimulatePolicyResponse simulation = 5;
  // simulation_basis is how many journalled decisions were replayed. Zero counts
  // over an empty journal mean "nothing to compare", NOT "no effect", and a
  // console must say which of the two it is showing.
  int32 simulation_basis = 6;
  // blocking is true when at least one problem is blocking. Derived, sent
  // explicitly so a client cannot disagree with the server about it.
  bool blocking = 7;

  // ── Authoring provenance and clarification ─────────────────────────────
  //
  // provenance maps a proposal field name to "stated" or "inferred". A draft
  // that mixes what the operator actually said with what the model filled in is
  // approved as if all of it were stated; this separates the two so review can
  // concentrate on the half nobody asked for.
  map<string, string> provenance = 8;

  // unmapped_phrases are the operator's words the model could NOT resolve to
  // anything in the vocabulary. Reporting them is what stops a silent drop: a
  // phrase that quietly vanished produces a boundary narrower than the operator
  // described, and nothing anywhere says so.
  repeated string unmapped_phrases = 9;

  // questions is non-empty when the request cannot be turned into a policy
  // without a decision only the operator can make.
  //
  // Deliberately on THIS response rather than a separate clarify RPC: one call
  // returns either a draft or a question, which keeps the pane a single branch
  // instead of a second round-trip with its own loading and error states.
  repeated ProposalQuestion questions = 10;
}

// ProposalQuestion asks the operator to resolve one phrase.
message ProposalQuestion {
  // phrase is the operator's own words, VERBATIM. Paraphrasing it makes the
  // question unanswerable — they have to recognise what they wrote.
  string phrase = 1;
  repeated ResolutionCandidate candidates = 2;
  // why_it_matters states what changes depending on the answer. A question
  // without it reads as bureaucracy and gets answered at random.
  string why_it_matters = 3;
}

// ResolutionCandidate is one tag the phrase might mean.
message ResolutionCandidate {
  string tag = 1;
  bool   closed = 2;
  int32  document_count = 3;
  // cost must be a real SENTENCE, not a label. "Did you mean `finance`?" is not
  // answerable; "`finance` is closed and currently granted to support-team, so
  // restricting it revokes that grant" is.
  string cost = 4;
}

// ── Principals ──────────────────────────────────────────────────────────────

message ListPrincipalsRequest {}

// PrincipalSpec is one identity the policy model can act on.
message PrincipalSpec {
  string id = 1;
  // kind is "agent" | "user" | "daemon" | "system" | "unknown". "unknown" is
  // honest for a principal seen only in a policy link, where nothing records
  // what sort of identity it was meant to be.
  string kind = 2;
  string display_name = 3;
  // sources names where this principal was OBSERVED — "agent_registry",
  // "group:<id>", "policy_link:<policy id>". A principal is derived, not
  // registered, so saying where it came from is what makes the row trustworthy.
  repeated string sources = 4;
  // group_ids are the groups holding it as a DIRECT member.
  repeated string group_ids = 5;
  // has_direct_policy marks a policy linked at this principal specifically,
  // rather than reaching it through a group or surface.
  bool has_direct_policy = 6;
  // orphaned marks a principal that a policy or group REFERS to but which is
  // registered nowhere. Such a policy applies to nobody and is indistinguishable
  // from a working boundary anywhere else in the console — the same defect class
  // as a policy linked to a surface nothing registers.
  bool orphaned = 7;
}

message ListPrincipalsResponse { repeated PrincipalSpec principals = 1; }

// ── Ingress activity ────────────────────────────────────────────────────────

message ListIngressActivityRequest {
  // surface filters to one entry point ("chat:telegram"); empty = all ingresses.
  string surface = 1;
  int32  limit = 2;
}

message IngressActivityOp {
  string surface = 1;
  // principal is the identity the decision was made for. On an ingress this is
  // the sender resolved through the entry point, or the ingress daemon itself
  // when no identity binding exists — which is exactly the state that makes
  // every sender interchangeable.
  string principal = 2;
  string resource = 3;
  int64  at_unix_ms = 4;
  // outcome is "answered" | "no_reply" | "policy_denied" | "would_have_denied"
  // | "blocked".
  //
  // "policy_denied" is the POLICY WORKING, and a console must not render it as
  // an error: a list of red rows trains an operator to loosen a boundary that is
  // doing its job. "would_have_denied" is a report-only policy that has not been
  // enforced yet — the rollout signal, and invisible everywhere else.
  //
  // "no_reply" (contract 0080) is a message that never got an answer. It is the
  // one outcome the decision-journal source could never surface, because a turn
  // that fails before touching a governed resource makes no access decision.
  string outcome = 5;
  string reason = 6;

  // ── contract 0080: the CONTACT view ──────────────────────────────────────
  //
  // Sourced from the durable conversation record rather than the in-memory
  // decision journal, which is what makes this list survive a restart and show
  // traffic that never asked the decision point anything.

  // external_id is the sender's address on the far side, as the ingress knows it.
  string external_id = 7;
  // text is the most recent thing they said. Populated only when the deployment
  // records message bodies — see request_text_available.
  string text = 8;
  // message_count counts what the PERSON sent, not the whole exchange: an
  // operator judging whether someone should be bound cares how much they asked.
  int32 message_count = 9;
  string conversation_id = 10;
}

message ListIngressActivityResponse {
  repeated IngressActivityOp activity = 1;
  // request_text_available reports whether this deployment records what was
  // ASKED.
  //
  // True when the list is built from the conversation store, which holds message
  // bodies. False when only the decision journal was available — that records
  // access decisions, not request bodies — and a console must then say "not
  // recorded" rather than render an empty column reading as "they asked nothing".
  bool request_text_available = 2;
}

// ── Identity bindings ───────────────────────────────────────────────────────

// IdentityBindingSpec maps one external identity on one surface to a principal
// or a group.
message IdentityBindingSpec {
  string surface = 1;
  // external_id is the STABLE NUMERIC id from the platform — never the username,
  // never the phone number.
  //
  // A username changes, so binding on one binds on something the person can
  // alter at will: an impersonation vector rather than an identity. A phone
  // number arrives only when someone deliberately shares a contact card, so
  // binding on it makes identity depend on an unrelated act.
  string external_id = 2;
  // username is a LABEL so a console can show a recognisable name. Never matched on.
  string username = 3;
  string display_name = 4;
  // bound_to_kind is "principal" | "group" | "room_group".
  //
  // The third is a DELEGATION and is its own kind on purpose: anyone an admin
  // adds to that room inherits the group the moment they mention the bot, so an
  // audit must be able to tell a delegated room from a named person.
  string bound_to_kind = 5;
  string bound_to_id = 6;
  int64  bound_at_unix_ms = 7;
  // username_changed_from lets a console say "the binding held, because it is on
  // the id" rather than leaving an operator wondering whether a renamed account
  // is still the same person.
  string username_changed_from = 8;
  bool   blocked = 9;
}

message ListIdentityBindingsRequest { string surface = 1; }
message ListIdentityBindingsResponse { repeated IdentityBindingSpec bindings = 1; }

message BindIdentityRequest {
  IdentityBindingSpec binding = 1;
  // reason is mandatory and audited: a binding grants reach, so who widened it
  // and why is the question asked after something goes wrong.
  string reason = 2;
}

message UnbindIdentityRequest {
  string surface = 1;
  string external_id = 2;
  string reason = 3;
}

message ListUnboundSendersRequest { string surface = 1; }

// UnboundSenderSpec is someone who has spoken without a binding.
message UnboundSenderSpec {
  string surface = 1;
  string external_id = 2;
  // username and display_name are LABELS relayed from the platform, never
  // matched on. EMPTY when more than one person speaks through this external id
  // — see speaker_ids — because a shared entry point has no single name, and
  // labelling it after whoever spoke first would let an operator bind a room
  // believing they had bound the person they saw.
  string username = 3;
  string display_name = 4;
  int64  first_seen_unix_ms = 5;
  int64  last_seen_unix_ms = 6;
  int32  message_count = 7;
  // speaker_ids are the distinct people observed speaking through this external
  // id (contract 0080), bounded.
  //
  // An external id is not always a person: in a 1:1 chat it is, and in a group it
  // is the ROOM. More than one entry here means binding this row binds the room,
  // and everyone in it inherits whatever it is bound to.
  repeated string speaker_ids = 8;
}

message ListUnboundSendersResponse { repeated UnboundSenderSpec senders = 1; }

message BlockSenderRequest {
  string surface = 1;
  string external_id = 2;
  // blocked false un-blocks, so the RPC is reversible without a second one.
  bool   blocked = 3;
  string reason = 4;
}

message GetStrangerPolicyRequest { string surface = 1; }

message StrangerPolicySpec {
  string surface = 1;
  // mode is "surface_default" | "guest_principal" | "refuse_until_bound".
  //
  // "surface_default" is today's behaviour and is worth naming rather than
  // treating as neutral: it is the state where two different people are governed
  // by one rule because nobody is distinguished.
  //
  // "refuse_until_bound" REPLIES once rather than ignoring — silent ignoring is
  // indistinguishable from a broken bot, so the person retries instead of asking
  // an operator to bind them.
  string mode = 2;
  string guest_principal_id = 3;
  // readable_documents is THE reach: how many documents an unbound sender can
  // read right now. -1 when it cannot be computed.
  //
  // It is what makes this panel a decision instead of a preference. "Whatever you
  // set here is what a person you have never heard of gets" is abstract; "right
  // now a stranger can read 1204 documents" is not. A console cannot compute it —
  // that would mean evaluating the whole policy set against a principal that does
  // not exist yet.
  int64 readable_documents = 4;
}

message SetStrangerPolicyRequest {
  StrangerPolicySpec policy = 1;
  string reason = 2;
}
