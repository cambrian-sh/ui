// SubstrateLane (ADR-0108 D4): the event-shaped knowledge plane.
//
// Premium-owned, mounted on the kernel server via Registry.AddGRPCService
// behind the same operator auth as everything else — the pinned OSS operator
// contract is untouched (the receipts-lane precedent).
//
// Ingest is ASYNC by design: IngestEvent archives the delivery as evidence and
// returns; the outbox consumer transforms it into typed rows moments later.
// The reads answer exactly over STORED rows — no embedding, no model, no
// ranking — and their guarantee is exact-over-stored-data, never world truth.
syntax = "proto3";

package cambrian.premium.substrate;

option go_package = "github.com/cambrian-sh/cambrian-premium/api/proto/substrate;substratepb";

import "google/protobuf/timestamp.proto";

service SubstrateLane {
  // IngestEvent preserves one event-shaped delivery as evidence (ADR-0105
  // ordering: durable bytes before the row, ACK only after commit) and
  // enqueues it for transformation. deduplicated=true means this exact
  // delivery was already archived and nothing was written.
  rpc IngestEvent(IngestEventRequest) returns (IngestEventResponse);

  // PointLookup returns the LATEST stored observation for an entity and
  // predicate. found=false is an answer, not an error.
  rpc PointLookup(PointLookupRequest) returns (PointLookupResponse);

  // History returns the entity's observations for a predicate in
  // [from, to), oldest first.
  rpc History(HistoryRequest) returns (HistoryResponse);

  // EventsForEntity returns events the entity participated in (any role)
  // within [from, to), oldest first, roles included.
  rpc EventsForEntity(EventsForEntityRequest) returns (EventsForEntityResponse);

  // CheckPolicy classifies one message against the CURRENT policy-statement
  // resolutions (ADR-0109): a closed five-way outcome per detected claim,
  // deterministic end to end. The §7D measurement drives this RPC.
  rpc CheckPolicy(CheckPolicyRequest) returns (CheckPolicyResponse);

  // Query executes the closed knowledge-query AST (ADR-0111). A request
  // outside the AST returns InvalidArgument "cannot express safely" — never
  // invented SQL, never a guess. Rows are JSON objects (v1 wire shape); every
  // response names its guarantee (exact-over-stored, exact-and-complete, …).
  rpc Query(QueryRequest) returns (QueryResponse);

  // AskKnowledge (ADR-0118 D5's deferred arm, now built and measured):
  // compiles ONE natural-language question into the closed AST with a temp-0
  // model over a DETERMINISTIC catalog, then executes it through the same
  // validated, scoped plane. The model forms the QUERY, never the answer: a
  // compiled query naming anything outside the catalog is refused, not
  // executed, so NL convenience never becomes NL guessing. The compiled query
  // returns WITH the answer, so a caller always sees exactly what was asked
  // of the store; an open-ended question is refused with a lane hint naming
  // the memory lane as the right tool.
  rpc AskKnowledge(AskKnowledgeRequest) returns (AskKnowledgeResponse);

  // Overview reports what the substrate holds: per-lane row counts, per-kind
  // counts, per-source holdings (each ingress surface with its classification
  // tags — which surface contributed what, and which scopes gate it), ingest
  // health (evidence-outbox backlog), current cross-actor contradiction
  // count, and the time span covered. Plain deterministic reads.
  rpc Overview(OverviewRequest) returns (OverviewResponse);

  // ListDeadOutbox names the evidence-outbox items parked dead that
  // Overview.outbox_dead counts (T-20261113-dead-outbox-items-of-non-ingress-sources-have,
  // ENG-1100; owner decision 2026-11-19): every source, or one. An item whose
  // evidence came through an Ingress Studio ingress (source id "ingress:<id>")
  // is listed with replay_here = false: Ingress Studio's ReplayDeadDeliveries
  // replays it, together with the ingress's failed pipeline tasks.
  rpc ListDeadOutbox(ListDeadOutboxRequest) returns (ListDeadOutboxResponse);

  // ReplayDeadOutbox makes a source's dead outbox items pending again
  // (attempts 0, due now) so the ordinary consumer runs them again — no second
  // processing path; dead again if the cause is not fixed. Operator-only (not a
  // read by the operator plane's naming rule) and audited: refused when no
  // audit sink is configured. An ingress source is refused (replay it in
  // Ingress Studio). Replaying an item that is not dead is a no-op.
  rpc ReplayDeadOutbox(ReplayDeadOutboxRequest) returns (ReplayDeadOutboxResponse);

  // ListEntities finds modelled entities by substring — the catalog the
  // explore surface browses. Names and counts only; VALUES are disclosed
  // exclusively through the query plane.
  rpc ListEntities(ListEntitiesRequest) returns (ListEntitiesResponse);

  // GetOntology returns a namespace's CURRENT ontology declarations
  // (ADR-0149 D2): the kind and relation specs every write in it is validated
  // against, and their version. Open to Operator and Viewer.
  rpc GetOntology(GetOntologyRequest) returns (GetOntologyResponse);

  // ApplyOntologyChange classifies a change to a namespace's declarations —
  // additive (applied live), tightening (applied to new writes; existing rows
  // reported by ListOntologyViolations, never rejected) or breaking (refused:
  // it needs an explicit migration, which this RPC does not take) — and
  // applies it unless dry_run. Operator-only; mutating: command_id + reason,
  // audited, idempotent on command_id. A refused change answers
  // FailedPrecondition and applies nothing.
  rpc ApplyOntologyChange(ApplyOntologyChangeRequest) returns (ApplyOntologyChangeResponse);

  // ListOntologyViolations lists existing rows the namespace's current
  // declarations would refuse if written now (a query, not a table), fenced
  // to what the caller may read.
  rpc ListOntologyViolations(ListOntologyViolationsRequest) returns (ListOntologyViolationsResponse);

  // GetOntologyDraft returns an agent-drafted ontology change in full, for the
  // person deciding its ontology_change approval (whose object is the draft
  // id; the approval itself carries only a bounded preview): every spec of the
  // change next to the spec declared now under the same name, the
  // classification against the base version, the proposer and reason, its
  // state, and a dry run against the current declarations by the same body an
  // approval runs. Operator-only read; writes nothing. NotFound for an unknown
  // id.
  rpc GetOntologyDraft(GetOntologyDraftRequest) returns (GetOntologyDraftResponse);

  // ListObjects is the objects query (ADR-0149 D6) over the per-kind object
  // tables: typed filters, link filters (confirmed links, at most 2 hops),
  // sort with keyset paging, or groups and metrics. The request is closed and
  // validated against the live declarations: an unknown kind, property,
  // relation or operator, a wrongly typed literal, a request over a bound or a
  // page token reused with changed parameters is InvalidArgument; nothing ran.
  // Runs as the system principal on this plane (the Query rule).
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // GetObject is one object page (ADR-0149 D7): current properties with
  // provenance and visible conflicts, lifecycle, typed links in both
  // directions, aliases, recent timeline, evidence. NotFound for an id that is
  // not an object and for one the caller may not know exists alike.
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);

  // ── Listings (T-20261113-link-building-suite-reads-the-kernel-s-postgres,
  // owner decision 2026-11-14). What the identity plane produced, readable by a
  // black-box client: the links, the minted handles, and which event a source
  // record became. Before these a client could see links only one entity at a
  // time (the entity op) or as the review queue, so the link_building benchmark
  // read the substrate tables directly. All three run as the system principal
  // on this plane (the Query rule: the owner fence applies), are confined to one
  // namespace, paged in id order with an opaque page_token, and fenced in core
  // (domain.SubstrateCatalog): a row resting on evidence the reader may not
  // read is never listed. A page can come back short; next_page_token is empty
  // only when nothing follows.

  // ListLinks lists a namespace's link assertions, optionally by state and
  // producer prefix. Retracted assertions are left out unless asked for.
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse);

  // ListEvents lists a namespace's events by source_ref prefix: which event
  // a source record became. Retired events are never listed.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // ListEntityHandles lists a namespace's minted entity handles.
  rpc ListEntityHandles(ListEntityHandlesRequest) returns (ListEntityHandlesResponse);
}

// ── Objects (ADR-0149 D6, D7) ────────────────────────────────────────────────
//
// One request type for every caller: the operator plane and the agent plane
// take these messages, and the published MCP tools' JSON Schema is generated
// from ListObjectsRequest / GetObjectRequest and parsed back into them. Access
// is per property: a value the caller may not read is absent — not returned,
// matching no filter but is_null, sorting last, grouping under the empty key.

// TypedValue is one typed value; none set = absent.
message TypedValue {
  oneof value {
    google.protobuf.Timestamp date = 1;
    double number = 2;
    string text = 3;
    // An entity id ("customer/C-1").
    string entity_id = 4;
  }
}

// ObjectCondition tests one declared property. op: eq | ne | lt | le | gt | ge
// (number, date) | in | prefix (text) | is_null. values: one literal of the
// property's type; one or more for in; none for is_null.
message ObjectCondition {
  string property = 1;
  string op = 2;
  repeated TypedValue values = 3;
}

// ObjectLinkFilter keeps objects that reach, over confirmed links of the
// declared relations in path (from → to, 1 or 2 hops), an object satisfying
// where.
message ObjectLinkFilter {
  repeated string path = 1;
  ObjectCondition where = 2;
}

message ObjectOrder {
  string property = 1;
  bool desc = 2;
}

// ObjectMetric: count (no property) | sum | avg (number) | min | max (number, date).
message ObjectMetric {
  string fn = 1;
  string property = 2;
}

message ListObjectsRequest {
  // "" = the default namespace.
  string namespace = 1;
  // A declared kind with an object table.
  string kind = 2;
  // ANDed.
  repeated ObjectCondition where = 3;
  // ANDed; at most 4.
  repeated ObjectLinkFilter links = 4;
  // At most 3 keys; entity id ascending is always the last key; absent values sort last.
  repeated ObjectOrder order_by = 5;
  // With group_by or metrics the request is a GROUP request: buckets (at most
  // 1000, ordered by key) instead of rows; no order_by, fields or paging.
  repeated string group_by = 6;
  repeated ObjectMetric metrics = 7;
  // Returned properties; empty = every declared one.
  repeated string fields = 8;
  // 0 = 50; at most 200.
  int32 page_size = 9;
  // From next_page_token; only page_size may change between pages.
  string page_token = 10;
}

message PropertyValue {
  string property = 1;
  TypedValue value = 2;
}

message ObjectRow {
  string entity_id = 1;
  // The visible values among the requested fields.
  repeated PropertyValue values = 2;
}

message ObjectGroup {
  // One per group_by property; an absent value has no TypedValue set.
  repeated PropertyValue key = 1;
  // One per metric, in request order.
  repeated TypedValue metrics = 2;
}

message ListObjectsResponse {
  string kind = 1;
  // The declarations version the request was validated against.
  int64 decl_version = 2;
  repeated ObjectRow rows = 3;
  // "" = last page.
  string next_page_token = 4;
  repeated ObjectGroup groups = 5;
  // More than 1000 buckets exist; the first 1000 by key are returned.
  bool truncated = 6;
}

message GetObjectRequest {
  string namespace = 1;
  string entity_id = 2;
}

message ObjectAlternative {
  TypedValue value = 1;
  google.protobuf.Timestamp at = 2;
  string source = 3;
  string evidence_id = 4;
}

message ObjectProperty {
  string property = 1;
  TypedValue value = 2;
  // Event time of the current value and who said it.
  google.protobuf.Timestamp at = 3;
  string source = 4;
  string evidence_id = 5;
  // Other sources' current values the caller may read that differ.
  bool conflict = 6;
  repeated ObjectAlternative alternatives = 7;
}

message ObjectLifecycle {
  string state_predicate = 1;
  // "" = no visible state; allowed are then the initial states.
  string state = 2;
  repeated string allowed = 3;
}

message ObjectLink {
  string link_id = 1;
  string relation = 2;
  // The relation outgoing; its declared inverse (when any) incoming.
  string label = 3;
  string family = 4;
  // "out" | "in".
  string direction = 5;
  string other_ref = 6;
  string other_kind = 7;
  string evidence_id = 8;
  google.protobuf.Timestamp asserted_at = 9;
  google.protobuf.Timestamp valid_from = 10;
  google.protobuf.Timestamp valid_to = 11;
}

message ObjectTimelineEntry {
  // "event" | "property".
  string kind = 1;
  google.protobuf.Timestamp at = 2;
  string event_id = 3;
  string event_type = 4;
  map<string, string> roles = 5;
  string property = 6;
  TypedValue value = 7;
  string evidence_id = 8;
}

message GetObjectResponse {
  string entity_id = 1;
  string kind = 2;
  string namespace = 3;
  // Set only when the caller may read the evidence that minted the entity.
  google.protobuf.Timestamp created_at = 4;
  string first_seen_evidence = 5;
  int64 decl_version = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated ObjectProperty properties = 8;
  ObjectLifecycle lifecycle = 9;
  // Confirmed identity links.
  repeated ObjectLink aliases = 10;
  repeated ObjectLink links = 11;
  // Newest first: events the object took part in and recorded values.
  repeated ObjectTimelineEntry timeline = 12;
  // Every evidence id the page cites, once.
  repeated string evidence = 13;
  // An OPEN kind's undeclared properties (the row's extra values), read-only and
  // ordered by name. Each is fenced by its OWN classification and parties, so a
  // caller sees exactly the extras it may read. Never filterable in ListObjects
  // and never what makes an object exist for a caller. Additive (ENG-1109, owner
  // decision 2026-11-15); an older kernel sends none.
  repeated ObjectProperty extra_properties = 14;
}

message GetOntologyRequest {
  string namespace = 1; // "" = "default"
}

message GetOntologyResponse {
  string namespace = 1;
  int64 version = 2;
  // The declarations as JSON: {"kinds":[KindSpec…],"relations":[RelationSpec…]}
  // — the CAMBRIAN_SUBSTRATE_KINDS kind shape and the config "relations" shape.
  string declarations_json = 3;
}

message ApplyOntologyChangeRequest {
  string command_id = 1;
  string reason = 2;
  string namespace = 3; // "" = "default"
  // The specs to add, or to replace by name, in the GetOntology JSON shape.
  string change_json = 4;
  // dry_run classifies without applying, auditing or deduplicating.
  bool dry_run = 5;
}

message OntologyChange {
  string class = 1; // additive | tightening | breaking
  string subject = 2; // "kind order.status", "relation placed_by"
  string detail = 3;
}

message ApplyOntologyChangeResponse {
  string command_id = 1;
  bool deduped = 2;
  bool applied = 3;
  int64 version = 4; // the namespace's version after the call
  string class = 5; // the most severe class among changes
  repeated OntologyChange changes = 6;
}

message ListOntologyViolationsRequest {
  string namespace = 1; // "" = "default"
  int32 limit = 2; // 0 = 200, max 1000
}

message OntologyViolation {
  // required | enum | range | from_kind | to_kind | cardinality | required_link
  string rule = 1;
  string subject = 2;
  string ref = 3; // the offending item, link or entity id
  string detail = 4;
}

message ListOntologyViolationsResponse {
  int64 version = 1;
  repeated OntologyViolation violations = 2;
  bool truncated = 3;
}

message GetOntologyDraftRequest {
  string draft_id = 1; // the ontology_change approval's object
}

// One kind or relation spec the draft declares, next to what is declared now.
message OntologyDraftSpec {
  string type = 1; // kind | relation
  string name = 2;
  // The spec as drafted, in the GetOntology JSON shape (a KindSpec or a
  // RelationSpec).
  string new_json = 3;
  // The spec declared under name NOW; "" = the name is new.
  string current_json = 4;
}

message GetOntologyDraftResponse {
  string draft_id = 1;
  string namespace = 2;
  string proposer = 3; // "agent:<id>"
  string reason = 4;
  int64 created_at_unix_ms = 5;
  // The classification as drafted, against base_version.
  int64 base_version = 6;
  string class = 7; // additive | tightening
  repeated OntologyChange changes = 8;
  // The whole change as drafted, in the GetOntology JSON shape.
  string change_json = 9;
  repeated OntologyDraftSpec specs = 10;
  // pending | applied | rejected | expired | superseded, who moved it there,
  // why, and the version an applied draft became.
  string state = 11;
  string state_by = 12;
  string detail = 13;
  int64 applied_version = 14;
  string approval_id = 15;
  // The namespace's declarations version now (≠ base_version: it moved since
  // the draft).
  int64 current_version = 16;
  // A dry run against the current declarations, with the approval's
  // still-as-drafted check; present only while the draft is pending.
  // dry_run_refusal says why approving now would apply nothing ("" = it would
  // apply as drafted).
  bool dry_run_ran = 17;
  string dry_run_class = 18;
  repeated OntologyChange dry_run_changes = 19;
  string dry_run_refusal = 20;
}

message AskKnowledgeRequest {
  string question = 1;
}

message AskKnowledgeResponse {
  // answered=true: compiled + guarantee + rows are set. answered=false:
  // refusal_reason names why (unexpressible, open-ended, names outside the
  // catalog, no model configured), lane_hint optionally names the right tool.
  bool answered = 1;
  QueryRequest compiled = 2;
  string guarantee = 3;
  repeated string rows = 4; // JSON objects (v1 wire shape)
  string refusal_reason = 5;
  string lane_hint = 6; // "memory" when the corpus lane is the right tool
  // ADR-0149 D6 (ENG-1092): the ONE model call may answer with an objects
  // request instead of a query. Then compiled is unset, compiled_objects is the
  // ListObjectsRequest that ran (re-runnable verbatim through ListObjects /
  // list_objects) and objects its result; guarantee and rows carry the same
  // answer (one JSON row per object or group), so a row renderer needs nothing
  // new.
  ListObjectsRequest compiled_objects = 7;
  ListObjectsResponse objects = 8;
}

message OverviewRequest {}

message SourceOverview {
  string source_id = 1; // evidence source: the ingress/stream that contributed
  int64 evidence_count = 2;
  google.protobuf.Timestamp last_seen = 3;
  repeated string classification = 4; // distinct tags this source's rows carry
}

message KindCount {
  string kind = 1;
  int64 count = 2;
}

message OverviewResponse {
  int64 evidence_count = 1;
  int64 event_count = 2;
  int64 observation_count = 3;
  int64 knowledge_item_count = 4;
  int64 live_resolution_count = 5;
  int64 entity_count = 6;
  int64 actor_count = 7;
  // Evidence rows archived but not yet transformed into typed rows — "your
  // data is still materializing", the async-ingest health number. Work that
  // will still happen: due, backing off after a failure, or held while its
  // ingress is paused. Dead items are NOT included (outbox_dead) — since
  // 2026-11-13; before, pending counted them too.
  int64 outbox_pending = 8;
  // Entities whose CURRENT resolutions disagree across actors, summed over
  // all item kinds — disagreement is a headline metric, not a buried query.
  int64 contradiction_count = 9;
  google.protobuf.Timestamp earliest = 10; // oldest occurred_at held
  google.protobuf.Timestamp latest = 11;   // newest occurred_at held
  repeated SourceOverview sources = 12;
  repeated KindCount kinds = 13;
  // Evidence rows whose transformation failed on every attempt and was parked
  // dead (the evidence outbox's dead-letter state): never retried
  // automatically. An ingress's dead deliveries are listed by Ingress Studio's
  // ListDeliveryFailures and re-queued by ReplayDeadDeliveries; every source's
  // are listed by ListDeadOutbox (and, outside an ingress, re-queued by
  // ReplayDeadOutbox).
  int64 outbox_dead = 14;
}

message ListDeadOutboxRequest {
  string source_id = 1; // empty = every source
  int32 limit = 2;      // 0 = 100; at most 500
}

// DeadOutboxItem is one evidence-outbox item parked dead after its last
// attempt failed.
message DeadOutboxItem {
  int64 outbox_id = 1;
  string evidence_id = 2;
  string source_id = 3;
  int32 attempts = 4;
  string last_error = 5;
  google.protobuf.Timestamp dead_at = 6;
  // replay_here is false for an Ingress Studio source: replay it there.
  bool replay_here = 7;
}

message ListDeadOutboxResponse {
  repeated DeadOutboxItem items = 1; // most recently dead first
}

message ReplayDeadOutboxRequest {
  string source_id = 1;   // required: a replay is scoped to one source
  string evidence_id = 2; // optional: just that delivery's item
  string reason = 3;      // recorded in the audit entry
}

message ReplayDeadOutboxResponse {
  bool ok = 1;
  int32 replayed = 2; // items made pending again
  string detail = 3;
  string error = 4; // set when ok is false
}

message ListEntitiesRequest {
  string query = 1; // substring; empty lists most-recently-observed entities
  int32 limit = 2;  // 0 = 50
}

message EntityOverview {
  string entity_id = 1;
  int64 observation_count = 2;
  repeated string predicates = 3;
  google.protobuf.Timestamp last_seen = 4;
}

message ListEntitiesResponse {
  repeated EntityOverview entities = 1;
}

// SubstrateRetrieval (ADR-0118 D4): the AGENT-facing retrieval surface over
// the same closed AST. A separate service rather than a dual-mode
// SubstrateLane because ADR-0047's lesson is that overloading one plane for
// two audiences smuggles one past the other's auth. Declared agent-facing at
// registration (Registry.AddAgentGRPCService): no operator bearer,
// SurfaceAgent, caller principal seeded kernel-side from x-agent-id. Reads are
// scope-enforced fail-closed for the calling agent; guarantee labels and
// refusal semantics are identical to the operator lane — the agent gets the
// same warranty an operator gets.
service SubstrateRetrieval {
  // Query executes the closed AST as the calling agent's principal. Absent or
  // unknown principal → PermissionDenied (fail closed); outside the AST →
  // InvalidArgument "cannot express safely"; rows the principal's scope does
  // not reach are simply absent, never redacted in place.
  rpc Query(QueryRequest) returns (QueryResponse);

  // ListObjects and GetObject (ADR-0149 D6, D7) as the calling agent's
  // principal: the operator lane's messages and refusals; values, links and
  // objects the principal's scope does not reach are absent.
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
}

message QueryRequest {
  // "point" | "history" | "as_of" | "current" | "contradictions" |
  // "aggregate" | "events" | "traverse" | "evidence" | "entity" | "why"
  //
  // "entity" and "why" arrived with the identity plane (five-planes step 2;
  // FIVE-PLANES-BUILD.md). They read LINKS — assertions ABOUT refs — rather than
  // observations, and their guarantee labels say so: an entity answer is exact
  // over stored links with identity "as asserted", and a why answer labels every
  // hop with the mechanism that produced it because a correlation hop is not a
  // causal one.
  string kind = 1;
  string entity_id = 2;
  string predicate = 3;
  string item_kind = 4;
  string policy = 5;
  string actor = 6;
  google.protobuf.Timestamp as_of = 7;
  google.protobuf.Timestamp from = 8;
  google.protobuf.Timestamp to = 9;
  string aggregate = 10;
  int32 hops = 11;
  int32 limit = 12;
  string evidence_id = 13;
  // expand_aliases widens the SUBJECT of an entity-scoped shape (point, history,
  // aggregate, events, traverse, entity) across the entity's CONFIRMED identity
  // closure. The closure verbs come from the deployment's relation registry; the
  // kernel never names one.
  //
  // It widens the subject and nothing else. Every row still passes the caller's
  // own scope on that row's own classification and parties, so a confirmed link
  // can add rows a caller may read and can never add rows a caller may not.
  // Requesting it on a shape with no entity subject is REFUSED rather than
  // ignored — a silently dropped flag makes a narrow answer look complete.
  //
  // Guards: depth 2 by default, hard cap 3, at most 8 entities in the set (over
  // that the query is refused, never truncated), and an entity claimed by more
  // than 16 links of one mechanism is flagged and excluded from expansion.
  bool expand_aliases = 14;
  // ADR-0148 (accepted 2026-11-12): `why` answers from STORED lineage unless
  // include_correlation asks for RELATED rows as well — earlier events that
  // share a participant with an event the walk stands on, inside the window,
  // hub-damped and ranked by score, at most 8 per event, labelled
  // row:"related" with a score. Related rows are NOT causes. Refused on every
  // kind but why, and the two fields below are refused without it.
  //
  // With the flag off, an empty why answer whose root has related events
  // carries one row:"hint" (related_count, text) instead of silence.
  bool include_correlation = 15;
  // How far back a related event may lie; 0 = 72 h, refused above 30 days.
  int64 correlation_window_seconds = 16;
  // When set, a shared participant counts only if its role in BOTH events is
  // listed. Roles are deployment data; the kernel names none.
  repeated string correlation_roles = 17;
  // include_retired (ADR-0147 D6, ENG-1045) returns RETIRED typed rows too on
  // point, history and events — rows a superseded mapping revision or a source
  // deletion took out of every count — each marked retired:true with
  // retired_reason, retired_by and retired_at. Refused on every other kind.
  // OPERATOR PLANE ONLY (owner decision 2026-11-15): honoured on
  // SubstrateLane.Query, refused (PermissionDenied) on SubstrateRetrieval.Query
  // and for every agent principal — an agent's answer never draws on a value the
  // source deleted or a mapping superseded.
  bool include_retired = 18;
}

message QueryResponse {
  string guarantee = 1;
  repeated string rows = 2; // JSON objects
  // closure_size is how many ALIASES beyond the subject an expand_aliases answer
  // was drawn over; 0 for every unexpanded query. The guarantee already says so
  // in words, and this says it in a number — a consumer should not have to parse
  // a sentence to learn how wide the question it asked actually was.
  int32 closure_size = 3;
}

message CheckPolicyRequest {
  string text = 1;
}

message CheckPolicyResponse {
  repeated PolicyCheckResult results = 1;
}

message PolicyCheckResult {
  // "deterministic_consistent" | "deterministic_contradictory" | "abstained"
  // | "no_policy_bound" | "no_quantitative_claim"
  string outcome = 1;
  string predicate = 2;
  double stated = 3;
  double bound = 4;
  string bound_kind = 5;
  // Why the check abstained ("hypothetical" | "negated" | "quoted"), when it did.
  string abstain_reason = 6;
}

// The §19.5 thin envelope: stream identity, source-native reference, times,
// and a payload the KERNEL never interprets — the transformer does.
message EventEnvelope {
  // Source stream identity ("anpr:lot-a"). Becomes evidence source_id.
  string stream = 1;
  // Source-native unique reference for this delivery (reading id). The
  // idempotency key end to end: evidence, event and observation rows all
  // dedupe on it.
  string source_ref = 2;
  // When the source says it happened (world clock, attacker-controllable).
  google.protobuf.Timestamp occurred_at = 3;
  // The event type ("gate_passage") — data, never kernel vocabulary.
  string event_type = 4;
  // Typed participants: role -> entity id ("vehicle" -> "camera/plate/34-ABC").
  map<string, string> roles = 5;
  // Observations carried by this delivery.
  repeated ObservationValue observations = 6;
  // Classification tags as delivered.
  repeated string classification = 7;
}

message ObservationValue {
  string entity_id = 1;
  string predicate = 2;
  // Exactly one of the value fields is meaningful, selected by value_type:
  // "date" | "number" | "text" | "entity".
  string value_type = 3;
  google.protobuf.Timestamp value_date = 4;
  double value_number = 5;
  string value_text = 6;
  string value_entity_id = 7;
  string location = 8;
  double confidence = 9;
}

message IngestEventRequest {
  EventEnvelope envelope = 1;
}

message IngestEventResponse {
  string evidence_id = 1;
  bool deduplicated = 2;
}

message PointLookupRequest {
  string entity_id = 1;
  string predicate = 2;
}

message PointLookupResponse {
  bool found = 1;
  ObservationRow observation = 2;
}

message HistoryRequest {
  string entity_id = 1;
  string predicate = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message HistoryResponse {
  repeated ObservationRow observations = 1;
}

message ObservationRow {
  string entity_id = 1;
  string predicate = 2;
  string value_type = 3;
  google.protobuf.Timestamp value_date = 4;
  double value_number = 5;
  string value_text = 6;
  string value_entity_id = 7;
  string location = 8;
  google.protobuf.Timestamp occurred_at = 9;
  double confidence = 10;
  string evidence_id = 11;
}

message EventsForEntityRequest {
  string entity_id = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
}

message EventsForEntityResponse {
  repeated EventRow events = 1;
}

message EventRow {
  string id = 1;
  string event_type = 2;
  google.protobuf.Timestamp occurred_at = 3;
  map<string, string> roles = 4;
  string evidence_id = 5;
}

// ── Listings (ListLinks, ListEvents, ListEntityHandles) ─────────────────────

message ListLinksRequest {
  string namespace_id = 1;      // "" = "default"
  repeated string states = 2;   // candidate | confirmed; empty = all
  string producer_prefix = 3;   // literal prefix of the producer (name@version)
  bool include_retracted = 4;
  string page_token = 5;
  int32 limit = 6;              // 0 = 50; capped by the kernel
}

message LinkRow {
  string id = 1;
  string family = 2;     // identity | relation | lineage
  string from_ref = 3;
  string to_ref = 4;
  string relation = 5;
  string state = 6;
  string mechanism = 7;
  string producer = 8;
  double confidence = 9;
  string evidence_id = 10;
  google.protobuf.Timestamp valid_from = 11;   // unset = unbounded
  google.protobuf.Timestamp valid_to = 12;     // unset = unbounded
  google.protobuf.Timestamp retracted_at = 13; // set only with include_retracted
  google.protobuf.Timestamp recorded_at = 14;
}

message ListLinksResponse {
  repeated LinkRow links = 1;
  string next_page_token = 2;
}

message ListEventsRequest {
  string namespace_id = 1;      // "" = "default"
  string source_ref_prefix = 2; // literal; "" = every event that has a source_ref
  string page_token = 3;
  int32 limit = 4;              // 0 = 50; capped by the kernel
}

message ListedEvent {
  string id = 1;
  string event_type = 2;
  string source_ref = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message ListEventsResponse {
  repeated ListedEvent events = 1;
  string next_page_token = 2;
}

message ListEntityHandlesRequest {
  string namespace_id = 1; // "" = "default"
  string page_token = 2;
  int32 limit = 3;         // 0 = 50; capped by the kernel
}

message EntityHandle {
  string id = 1;
  string kind = 2;
}

message ListEntityHandlesResponse {
  repeated EntityHandle entities = 1;
  string next_page_token = 2;
}
