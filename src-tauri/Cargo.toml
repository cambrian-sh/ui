[package]
name = "cambrian-ui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cambrian_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Vendored protoc bundles Google well-known types → reproducible builds (no /usr/include dep).
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Operator Transport Plane client (talks gRPC to the runtime-core) ---
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
# keyring 3 gates every platform credential store behind a feature. With none enabled it
# falls back to an in-memory MOCK that accepts set_password and forgets it, so "remember me"
# silently did nothing across restarts. These features are what make it an actual keychain.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
thiserror = "1"
tracing = "0.1"
chrono = "0.4"

# --- OIDC authorization code + PKCE (ADR-0142 D1, src/oidc.rs) ---
# Decision (T-20261106-console-has-no-oidc-authorization-code-pkce): no OIDC/OAuth
# crate. The flow is ~400 lines over primitives this tree ALREADY resolves (every
# crate below is in Cargo.lock via tonic / tauri at the pinned version), so the
# console gains no new transitive dependencies. `openidconnect`/`oauth2` would add
# reqwest + its TLS stack and a JOSE layer we do not use (the kernel verifies
# signatures; the client checks iss/aud/nonce/exp over the TLS token response,
# OIDC Core 3.1.3.7 (6)). Pinned to the exact versions the lockfile carries.
sha2 = "=0.10.9"
base64 = "=0.22.1"
rand = "=0.8.7"
url = "=2.5.8"
hyper = { version = "=1.10.1", features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.4"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-native-certs = "=0.8.4"

